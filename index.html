<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Typography Example</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fdf6f0; /* pastel background */
            color: #333;
            margin: 0;
            padding: 30px;
        }

        h1 {
            font-size: 36px;
            font-weight: 600;
            color: #6a9c89;
        }

        h2 {
            font-size: 28px;
            font-weight: 500;
            color: #a26769;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .highlight {
            color: #ff8fab;
            font-weight: bold;
        }

        .small-text {
            font-size: 14px;
            color: #777;
        }

        .box {
            background-color: #ffe5ec;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Typography Example</h1>
    <h2>Sub Heading</h2>

    <p>
        This is a normal paragraph. Typography helps to improve the readability and design of a webpage.
    </p>

    <p class="highlight">
        This is highlighted text using typography styling.
    </p>

    <p class="small-text">
        This is small text used for notes or extra info.
    </p>

    <div class="box">
        <p>
            This is inside a styled box with pastel color background.
        </p>
    </div>

</body>
</html>
